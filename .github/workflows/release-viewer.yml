name: Release viewer bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run package:viewer

      - name: Upload viewer-dist.zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-viewer/viewer-dist.zip
          generate_release_notes: true
